name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm aktivieren
        run: corepack enable
      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format prüfen
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Shell-Skripte prüfen
        run: shellcheck -x infra/pi/*.sh infra/pi/lib/*.sh infra/pi/files/einlass-kiosk infra/pi/files/einlass-display-render
