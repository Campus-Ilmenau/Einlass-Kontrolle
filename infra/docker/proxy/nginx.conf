# HTTP: nur Weiterleitung auf HTTPS (und Healthcheck für Docker)
server {
  listen 80 default_server;
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;

  ssl_certificate /etc/einlass/tls/cert.pem;
  ssl_certificate_key /etc/einlass/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:1m;

  # Import-Dateien bis 5 MB (+ Puffer für multipart)
  client_max_body_size 6m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  root /usr/share/nginx/html;
  index index.html;

  # Live-Stream fürs Display (Server-Sent Events): keine Pufferung, lange Verbindung
  location /api/display/stream {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Überschreiben statt anhängen: Clients können X-Forwarded-For nicht fälschen
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  # Prototyp aus M1 (optional eingebunden, siehe compose.yml)
  location /poc/ {
    alias /usr/share/nginx/poc/;
    index index.html;
  }

  # Single-Page-App: unbekannte Pfade → index.html
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
